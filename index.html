<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA – Mặc chất riêng, tự tin mỗi ngày</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c1c1c'/%3E%3Cpath fill='%23e2e2de' d='M32 8l3.2 20.8L56 32l-20.8 3.2L32 56l-3.2-20.8L8 32l20.8-3.2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdfa;--ink:#211c18;--mut:#6d6258;--acc:#7a5c45;--line:#e2d7c9;--btn:#211c18;--btnt:#fffdfa;--r:#a33b32}
[data-theme=dark]{--bg:#171412;--card:#211d1a;--ink:#f4ede4;--mut:#b7aa9b;--acc:#c8a283;--line:#3b342e;--btn:#f4ede4;--btnt:#171412;--r:#e08a80}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font:400 15px/1.6 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(30px,6vw,52px)}h2{font-size:26px;margin-bottom:14px}h3{font-size:17px}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;max-width:1100px;margin:auto}
.logo{font:600 22px Fraunces,serif;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.top input{flex:1 1 140px;max-width:260px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
.b{background:var(--btn);color:var(--btnt);border:1px solid var(--btn);padding:8px 14px;border-radius:6px}
.b.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.b:disabled{opacity:.4;cursor:not-allowed}
.ib{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 11px}
#cn{background:var(--btn);color:var(--btnt);border-radius:10px;padding:0 7px;margin-left:4px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:1100px;margin:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:9px 12px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
main,footer{max-width:1100px;margin:auto;padding:24px 16px}
section>div+div{margin-top:36px}
.hero{display:grid;gap:24px;grid-template-columns:1fr;align-items:center}
@media(min-width:760px){.hero{grid-template-columns:1.1fr 1fr}}
.hero p{color:var(--mut);max-width:46ch}.hero .row{margin-top:16px}
.hi{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#efe5d7}.hi svg,.hi img{display:block;width:100%;height:auto}
.bnr{position:relative}.bnr .tr{display:flex;transition:transform .5s ease}.bnr .tr img{flex:0 0 100%;min-width:0}.bnr{transition:height .4s ease;overflow:hidden}.bnr .tr{align-items:flex-start}.bnr .tr img{height:auto;object-fit:contain}
.bnr .ar{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1}.bnr .ar.l{left:8px}.bnr .ar.r{right:8px}
.bnr .dt{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center}.bnr .dt button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid #fff;background:rgba(0,0,0,.35)}.bnr .dt button.on{background:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:1;background:#f1e8db}.im svg{width:100%;height:100%;display:block}.im img{width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);border-radius:4px;padding:2px 8px;font-size:12px}.tag.r{background:var(--r);color:#fff}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.cb small{color:var(--mut)}
.pr{font-weight:600;margin:0}.st{margin:0;font-size:13px;color:var(--mut)}.ds{margin:0;font-size:13px;color:var(--mut);flex:1}
.sz,.row{display:flex;gap:6px;flex-wrap:wrap}.row .b{flex:1;padding:8px 6px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;padding:3px 10px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:8px;color:var(--mut);text-align:center}
table{width:100%;border-collapse:collapse;background:var(--card)}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.rv{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.rv p{margin:6px 0}.rp{margin:8px 0 0 12px;padding-left:10px;border-left:3px solid var(--line)}.rp p{margin:2px 0 4px}.star{color:#c98a1b}
ol.st3{padding-left:20px}ol.st3 li{margin-bottom:10px}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:14px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:50;padding:16px;overflow:auto;border-left:1px solid var(--line)}
.mv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--bg);border-radius:10px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;border:1px solid var(--line)}
.box h2{font-size:22px}label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
input:not([type=checkbox]),textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.ck{display:inline-flex;gap:6px;align-items:center;margin-right:12px;color:var(--ink)}
.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.ci .th{width:56px;height:56px;flex:none;border-radius:6px;overflow:hidden}.ci .th svg{width:100%;height:100%}
.q{display:inline-flex;gap:6px;align-items:center}.q button{width:28px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px}
.box.wide{max-width:920px}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}@media(max-width:700px){.pd{grid-template-columns:1fr}}
.gm{position:relative;aspect-ratio:3/4;background:#f1e8db;border-radius:8px;overflow:hidden}.gm svg{width:100%;height:100%;display:block}.gm img{width:100%;height:100%;object-fit:contain;display:block}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;padding:0}.gn.l{left:8px}.gn.r{right:8px}
.ths{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}.ths button{flex:none;width:62px;height:78px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#f1e8db}.ths button.on{border-color:var(--ink)}.ths svg{width:100%;height:100%;display:block}.ths img{width:100%;height:100%;object-fit:contain;display:block}
.pd h2{margin:0 0 4px}.pd .pp{font-size:20px;font-weight:600;margin:4px 0 10px}
.szb{display:flex;gap:8px;flex-wrap:wrap}.szb .chip{border-radius:20px;padding:7px 18px;font-size:14px}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);outline:2px solid transparent;outline-offset:3px;padding:0}.sw button.on{outline-color:var(--ink)}
.qb{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:4px}.qb button{width:38px;height:38px;border:0;background:none;color:var(--ink);font-size:18px}.qb span{min-width:34px;text-align:center}
.pd details{border-top:1px solid var(--line);padding:10px 0}.pd summary{cursor:pointer;font-weight:500}
.thl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tn{display:flex;flex-direction:column;gap:4px;align-items:center}.tn img{width:64px;height:80px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:90;max-width:90%}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
body.adm{padding-bottom:76px}
.err{color:var(--r);margin-top:8px}.note{font-size:13px;color:var(--mut)}
textarea[readonly]{font:13px/1.5 monospace}
.cl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw.sm{gap:8px}.sw.sm button{width:22px;height:22px;outline-offset:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.cr{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cr input[type=color]{width:44px;height:36px;padding:2px;flex:none}
.cr input.cn{flex:1 1 140px;width:auto}
.cr .up{display:inline-block;margin:0;cursor:pointer;padding:6px 12px;font-size:13px}
.cr .thl{flex-basis:100%;margin:0}
body{font-size:calc(15px*var(--fs,1))}
h1{font-size:calc(clamp(30px,6vw,52px)*var(--ft,1))}h2{font-size:calc(26px*var(--ft,1))}h3{font-size:calc(17px*var(--ft,1))}
footer{font-size:calc(14px*var(--fs,1))}.st,.ds,.note{font-size:calc(13px*var(--fs,1))}.pd .pp{font-size:calc(20px*var(--fs,1))}.row .b{font-size:calc(13px*var(--fs,1))}.szb .chip{font-size:calc(14px*var(--fs,1))}
.hero h1{font-size:calc(clamp(30px,6vw,52px)*var(--ft,1)*var(--bt,1)*var(--hs,1))}.hero p{font-size:calc(15px*var(--fs,1)*var(--bl,1)*var(--hs,1))}
.hero .b{font-size:calc(15px*var(--fs,1)*var(--bn,1)*var(--hs,1));padding:calc(8px*var(--hs,1)) calc(14px*var(--hs,1))}.hero .row{margin-top:calc(16px*var(--hs,1));gap:calc(8px*var(--hs,1))}.hero h1{margin-bottom:calc(10px*var(--hs,1))}

/* ===== Trang trí hoa lá ở banner ===== */
.hl{position:relative;overflow:hidden}.hl>.mid,.hl>.fx{position:relative;z-index:1}
@media(min-width:760px){.hero{align-items:stretch}.hero>.hi{align-self:center}.hl{display:flex;flex-direction:column;justify-content:space-between;gap:18px}}
.fx svg{display:block;width:min(100%,calc(250px*var(--hs,1)));height:auto;overflow:visible}.fx.bt2{padding:0 0 10px 6px}.fx.tp{padding:6px 0 0 6px}.fx.bt2 svg{width:min(100%,calc(290px*var(--hs,1)))}
.lf{fill:#9aa886}.lf2{fill:#b7c2a4}.vn{stroke:#6f7d5c;stroke-width:.8;fill:none;opacity:.6}.stm{stroke:#7f8c6b;stroke-width:1.6;fill:none;stroke-linecap:round}
.pt{fill:#f0cfc6;stroke:#d9a99c;stroke-width:.6}.fc{fill:#e9b86d}.pt2{fill:#fbefe9;stroke:#e3b8ac;stroke-width:.6}
[data-theme=dark] .lf{fill:#7d8c69}[data-theme=dark] .lf2{fill:#93a07f}[data-theme=dark] .pt{fill:#d9a99c}[data-theme=dark] .pt2{fill:#ead2c9}
.sway{transform-origin:12% 100%;animation:sway 7s ease-in-out infinite}.sway.b{animation-duration:9s;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.pets{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pet{position:absolute;top:-20px;width:12px;height:12px;background:#f0cfc6;border-radius:70% 0 70% 0;opacity:0;animation:fall 12s linear infinite}
[data-theme=dark] .pet{background:#d9a99c}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:.85}50%{transform:translate(26px,50%) rotate(180deg)}90%{opacity:.7}100%{transform:translate(-10px,110%) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.sway,.pet{animation:none}.pet{display:none}}

/* ===== Trăng vàng & logo ===== */
.fx.tp svg{width:min(100%,calc(300px*var(--hs,1)))}.fx.bt2 svg{width:min(100%,calc(290px*var(--hs,1)));filter:drop-shadow(0 6px 14px rgba(10,21,46,.28))}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 2.8s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(.45);opacity:.35}50%{transform:scale(1.15);opacity:1}}
.gl{transform-box:fill-box;transform-origin:center;animation:glw 4.5s ease-in-out infinite}
@keyframes glw{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.orb{transform-box:fill-box;transform-origin:center;animation:spn 26s linear infinite}.orb.r{animation-duration:38s;animation-direction:reverse}
.orb2{animation:spn 30s linear infinite;transform-origin:0 0}.orb2.r{animation-duration:46s;animation-direction:reverse}
@keyframes spn{to{transform:rotate(360deg)}}
.shm{animation:shm 6s ease-in-out infinite}@keyframes shm{0%,40%{transform:skewX(-18deg) translateX(0)}100%{transform:skewX(-18deg) translateX(520px)}}
.gt{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff6cf 0,#f1c85e 45%,rgba(241,200,94,0) 72%);opacity:0;animation:gtw 3.5s ease-in-out infinite}
@keyframes gtw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.6)}}
@media(prefers-reduced-motion:reduce){.tw,.gl,.orb,.orb2,.shm,.gt{animation:none}.gt{display:none}}

/* ===== Sao băng & logo (mới) ===== */
.fx.tp{padding:6px 0 0 6px}.fx.tp .sky{position:relative;width:min(100%,calc(220px*var(--hs,1)));aspect-ratio:16/8;border-radius:16px;overflow:hidden;background:radial-gradient(120% 140% at 20% 0,#22407a 0,#13244d 45%,#0a152e 100%);border:1px solid rgba(201,162,75,.6);box-shadow:0 8px 20px rgba(10,21,46,.25)}
.ts{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6cf;opacity:.3;animation:tsk 3s ease-in-out infinite}
@keyframes tsk{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1.3)}}
.ss{position:absolute;display:block;border-radius:2px;background:linear-gradient(90deg,rgba(255,226,140,0),rgba(255,236,170,.55) 70%,#fff);transform-origin:100% 50%;opacity:0;animation:shoot 5.5s ease-in infinite;filter:drop-shadow(0 0 4px rgba(255,226,140,.9))}
.ss::after{content:"";position:absolute;right:-2px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe9a8 50%,rgba(255,233,168,0) 75%)}
@keyframes shoot{0%{opacity:0;transform:rotate(32deg) translateX(-60px)}8%{opacity:1}30%{opacity:1}42%,100%{opacity:0;transform:rotate(32deg) translateX(420px)}}
.fx.lg{padding:0 0 10px 6px}.fx.lg img{display:block;width:min(100%,calc(140px*var(--hs,1)));height:auto;mix-blend-mode:multiply}

/* ===== Tồn kho theo màu và size ===== */
.st.ok{color:#2f8f5b;font-weight:600}.st.no{color:var(--r);font-weight:600}
.chip.sz1{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;padding:5px 12px;min-width:56px}.chip.sz1 small{font-size:11px;opacity:.85}
.szb .chip.sz1{border-radius:14px;padding:6px 16px;min-width:68px}
.chip.so{opacity:.45;cursor:not-allowed}.szh{margin:0}
.sw button{position:relative}.sw button.so{overflow:hidden}.sw button.so::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 45%,#c0392b 46%,#c0392b 54%,transparent 55%)}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-basis:100%}.stk .sk{margin:0}
body.adm footer{padding-bottom:96px}
.mt th,.mt td,table th,table td{font-size:calc(14px*var(--fs,1));line-height:1.4;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;vertical-align:middle;font-weight:400}
table th{font-weight:600}
.mt th:nth-child(1),.mt td:nth-child(1){width:56px;text-align:center}
.mt th:nth-child(2),.mt td:nth-child(2){width:140px;white-space:nowrap}
.mt td i{font-style:normal;color:var(--mut)}
.mt td .b{font-size:calc(13px*var(--fs,1));padding:6px 12px}
.mt{--mt-head:#4a2c17}
[data-theme=dark] .mt{--mt-head:#e0b891}
.mt th,.mt td{text-align:center;vertical-align:middle;font-family:inherit;font-size:calc(15px*var(--fs,1));font-weight:400;font-style:normal;line-height:1.4;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.mt td i{font-style:normal;font-size:inherit}
.mt thead th{font-weight:700;color:var(--mt-head)}

.sw.sm{gap:10px}.sw.sm button{width:34px;height:34px}.chip{padding:7px 14px;min-height:36px}.chip.sz1{min-height:44px}.qb button{width:44px;height:44px}.row .b{padding:11px 8px}
.st,.ds,.note,.cb small{font-size:calc(14px*var(--fs,1))}.cb h3{margin:0}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.flt select{width:auto;min-width:140px;flex:1 1 140px}
@media(max-width:560px){.pg{grid-template-columns:repeat(2,1fr);gap:10px}.pg .cb{padding:10px}.pg h3{font-size:15px}.pg .row .b{font-size:13px;padding:10px 4px}}

.pg .card{background:transparent;border:0;border-radius:0;overflow:visible}
.pg .im{background:#fff;border-radius:6px;overflow:hidden}
.pg .sob{position:absolute;left:0;right:0;bottom:0;background:#d90000;color:#fff;text-align:center;font-weight:600;padding:9px 0;border-radius:10px;letter-spacing:.03em}
.pg .cb{padding:12px 2px;gap:4px}
.pg h3{font:400 15px/1.35 'Be Vietnam Pro',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.pg .pr{color:#d90000;font-weight:700}[data-theme=dark] .pg .pr{color:#ff6b5e}
.pg .cl .note{display:none}.pg .sw.sm{gap:8px}.pg .sw.sm button{width:28px;height:28px;border:1px solid #cfcfcf}

.ch{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.ch h2{margin:0;text-transform:uppercase;font-weight:500;letter-spacing:.02em}.ch .cs{color:var(--mut);flex:1}
.ch .ca{background:none;border:0;border-bottom:1px solid var(--ink);color:var(--ink);text-transform:uppercase;padding:0 0 2px;letter-spacing:.04em}
.hc .im{background:#f3f3f3}
.cw{display:grid;gap:20px;grid-template-columns:1fr}.cw .pg{grid-template-columns:repeat(2,1fr)}
.cf{display:flex;flex-direction:column;gap:12px}.cf .fi{aspect-ratio:16/10;background:#efe5d7;overflow:hidden}.cf .fi img,.cf .fi svg{width:100%;height:100%;object-fit:cover;display:block}.cf p{margin:0;color:var(--mut)}
.chs{display:flex;gap:8px;flex-wrap:wrap}.chs button{background:none;border:1px solid var(--line);padding:9px 14px;color:var(--ink)}
@media(min-width:900px){.cw{grid-template-columns:1fr 2.6fr}.cw.rv2{grid-template-columns:2.6fr 1fr}.cw .pg{grid-template-columns:repeat(4,1fr)}.cf .fi{aspect-ratio:3/4}}
@media(min-width:561px){.hc>.grid.pg{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.cf .fi{aspect-ratio:2/1}.cf .fi img,.cf .fi svg{object-position:center 35%}.cf{gap:10px}.chs button{padding:8px 12px}}

.hc{margin-top:56px}
.ct{display:grid;gap:14px;grid-template-columns:1fr;align-items:end;margin-bottom:22px}
.ct .eb{margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-size:14px}

function compress(file,cb,mx,LIM,RAW){mx=mx||1600;LIM=LIM||800000;const r=new FileReader();r.onload=()=>{if(RAW&&r.result.length<=LIM)return cb(r.result);const im=new Image();im.onload=()=>{let k=Math.min(1,mx/Math.max(im.width,im.height)),u='';for(let t=0;t<10;t++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',RAW?.97:.92);if(u.length<=LIM)break;k*=RAW?.93:.85}cb(u)};im.onerror=()=>toast('Không đọc được ảnh');im.src=r.result};r.readAsDataURL(file)}

async function pack(p){const ch=[],add=(slot,arr)=>(arr||[]).forEach((d,i)=>ch.push({id:p.id+'__'+slot+'_'+i,imgOf:p.id,slot,i,d}));add('g',p.imgs);(p.colors||[]).forEach((c,x)=>add('c'+x,c.imgs));
const doc=JSON.parse(JSON.stringify(p));delete doc.id;delete doc._full;delete doc._ch;delete doc._ed;
doc.imgs=(p.imgs||[]).length?[await thumb(p.imgs[0])]:[];doc.img=doc.imgs[0]||'';
doc.colors=await Promise.all((p.colors||[]).map(async c=>({name:c.name,hex:c.hex,stk:c.stk||{},imgs:(c.imgs||[]).length?[await thumb(c.imgs[0])]:[]})));doc.lz=1;return{doc,ch}}
async function wrChunks(pid,ch){const old=await db.collection('products').where('imgOf','==',pid).get(),keep=new Set(ch.map(c=>c.id));let b=db.batch(),n=0;const flush=async()=>{if(n){await b.commit();b=db.batch();n=0}};

epol(){form('Sửa chính sách mua hàng',[{k:'policy',l:'Nội dung chính sách (xuống dòng để tách ý)',t:'area'}],{policy:S.policy||''},v=>{if(v.policy.length>1500)return 'Tối đa 1500 ký tự';S.policy=v.policy;toast('Đã sửa chính sách, nhớ bấm "Lưu thay đổi"')})},
fsm(){uz=Math.max(.8,Math.round((uz-.1)*10)/10);try{localStorage.setItem('lune_zoom',uz)}catch(e){}render()},fsp(){uz=Math.min(1.6,Math.round((uz+.1)*10)/10);try{localStorage.setItem('lune_zoom',uz)}catch(e){}render()},
bprev(){bgo(bi-1);bnStart()},bnext(){bgo(bi+1);bnStart()},bgo(e){bgo(+e.dataset.i);bnStart()},
rp(e){const f=e.dataset.f;form('Trả lời bình luận',[{k:'name',l:'Tên của bạn',t:'text'},{k:'text',l:'Nội dung trả lời (viết tiếng Việt, tối đa 500 ký tự)',t:'area'}],{},v=>{if(v.name.length<2||v.name.length>60)return 'Tên cần từ 2 đến 60 ký tự';if(v.text.length<2||v.text.length>500)return 'Nội dung cần từ 2 đến 500 ký tự';if(Date.now()-lastRp<15000)return 'Bạn vừa gửi, hãy đợi vài giây rồi thử lại';lastRp=Date.now();const r={fid:f,name:v.name,text:v.text,date:new Date().toLocaleDateString('vi-VN'),ts:Date.now()};if(FB&&db){db.collection('replies').add(r).then(d=>{r.id=d.id;R.push(r);render();toast('Đã đăng trả lời')}).catch(()=>toast('Chưa gửi được trả lời, hãy thử lại'));return}r.id='local_'+Date.now();R.push(r);toast('Chưa kết nối Firebase nên trả lời chỉ hiện đến khi tải lại trang')})},
dr(e){const id=e.dataset.r,done=()=>{R=R.filter(r=>r.id!==id);render();toast('Đã xoá trả lời')};FB&&db&&!id.startsWith('local_')?db.collection('replies').doc(id).delete().then(done).catch(()=>toast('Không xoá được')):done()},
rev(e){db.collection('admins').doc(e.dataset.e).delete().then(()=>{toast('Đã thu hồi quyền');loadAdmins()}).catch(()=>toast('Không thu hồi được'))},
orr(){orLoaded=false;orErr=false;render();loadOrders()},
ox(e){if(!confirm('Huỷ đơn này? Nếu đơn đã trừ kho thì kho sẽ được hoàn lại.'))return;const ref=db.collection('orders').doc(e.dataset.o);db.runTransaction(async t=>{const o=await t.get(ref);if(!o.exists)throw new Error('Không tìm thấy đơn');const st=o.data().status;if(st!=='pending'&&st!=='paid'&&st!=='confirmed')throw new Error('Đơn này đã được huỷ');let rs=[],its=[];if(st==='paid'||st==='confirmed'){its=o.data().items||[];const ids=[...new Set(its.map(it=>it.id))];rs=await Promise.all(ids.map(pid=>t.get(db.collection('products').doc(pid))))}rs.filter(r=>r.exists).forEach(r=>t.update(r.ref,applyDelta(r.data(),its.filter(it=>it.id===r.id),1)));t.update(ref,{status:'cancelled'})}).then(()=>refreshStock()).then(()=>{toast('Đã huỷ đơn');render();loadOrders()}).catch(e=>toast(e.message||'Không huỷ được đơn'))},
ap(){pForm('Thêm sản phẩm',{cat:Object.keys(S.cats)[0],sub:(S.cats[Object.keys(S.cats)[0]]||[])[0],k:'tee',flags:[],price:0,stk:{}},v=>{S.products.push({id:'p'+Date.now(),...v});toast('Đã thêm, nhớ bấm "Lưu thay đổi"')})},
ep(e){const p=prod(e.dataset.id);full(p).then(()=>{if(p._full===false)return toast('Chưa tải được ảnh sản phẩm, hãy thử lại');pForm('Sửa sản phẩm',p,v=>{const bf=JSON.stringify([p.imgs,(p.colors||[]).map(c=>c.imgs)]);Object.assign(p,v);p._ed=1;if(bf!==JSON.stringify([p.imgs,(p.colors||[]).map(c=>c.imgs)]))p._ch=1;toast('Đã sửa, nhớ bấm "Lưu thay đổi"')})})},
dp(e){if(!confirm('Xoá sản phẩm này?'))return;S.products=S.products.filter(p=>p.id!==e.dataset.id);cart=cart.filter(i=>i.id!==e.dataset.id);svCart();render()},
am(){form('Thêm thành viên',[{k:'mssv',l:'MSSV',t:'text'},{k:'name',l:'Họ và tên',t:'text'},{k:'role',l:'Vai trò',t:'text'}],{},v=>{S.members.push(v)})},
em(e){const m=S.members[+e.dataset.i];form('Sửa thành viên',[{k:'mssv',l:'MSSV',t:'text'},{k:'name',l:'Họ và tên',t:'text'},{k:'role',l:'Vai trò',t:'text'}],m,v=>{Object.assign(m,v)})},
dm(e){S.members.splice(+e.dataset.i,1);render()},
af(){form('Thêm phản hồi thật của khách',[{k:'name',l:'Tên khách hàng',t:'text'},{k:'text',l:'Nội dung (tiếng Việt)',t:'area'},{k:'stars',l:'Số sao (1 đến 5)',t:'number'},{k:'date',l:'Ngày',t:'text'}],{stars:5},v=>{if(!v.name||!v.text)return 'Hãy nhập tên và nội dung';if(!(v.stars>=1&&v.stars<=5))return 'Số sao phải từ 1 đến 5';S.feedbacks.unshift({...v,stars:Math.round(v.stars),sample:false,id:'f'+Date.now().toString(36)})})},
df(e){S.feedbacks.splice(+e.dataset.i,1);render()},
el(){form('Giới thiệu và giao diện',[{k:'lead',l:'Câu giới thiệu đầu trang',t:'area'},{k:'about',l:'Nội dung trang Về chúng tôi',t:'area'},{k:'bg',l:'Màu nền (dạng #f6f1ea, để trống = mặc định)',t:'text'},{k:'fs',l:'Cỡ chữ nội dung',t:'sel',o:[['0.9','Nhỏ (90%)'],['1','Vừa (100%)'],['1.15','Lớn (115%)'],['1.3','Rất lớn (130%)']]},{k:'ft',l:'Cỡ chữ tiêu đề',t:'sel',o:[['0.85','Nhỏ (85%)'],['1','Vừa (100%)'],['1.2','Lớn (120%)'],['1.4','Rất lớn (140%)']]}],{lead:S.lead,about:S.about,bg:S.theme.bg,fs:S.theme.fs||'1',ft:S.theme.ft||'1'},v=>{if(v.bg&&!/^#[0-9a-f]{6}$/i.test(v.bg))return 'Màu nền phải có dạng #aabbcc';S.lead=v.lead;S.about=v.about;S.theme.bg=v.bg;S.theme.fs=v.fs;S.theme.ft=v.ft})}
};
document.addEventListener('click',ev=>{const m=$('#modal');if(ev.target===m)return closeModal();const e=ev.target.closest('[data-act]');if(e&&A[e.dataset.act])A[e.dataset.act](e)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(mode)closeAll()}
const t=ev.target.closest&&ev.target.closest('[role=tab]');if(t&&['ArrowRight','ArrowLeft','Home','End'].includes(ev.key)){ev.preventDefault();const i=TABS.findIndex(x=>x[0]===tab),n=ev.key==='Home'?0:ev.key==='End'?TABS.length-1:(i+(ev.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;tab=TABS[n][0];render();$('#tb-'+tab).focus()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('ps')){tmpStk[t.dataset.s]=Math.max(0,Math.floor(Number(t.value))||0);return}const r=t.closest&&t.closest('.cr');if(!r)return;const c=tmpCols[+r.dataset.x];if(!c)return;if(t.classList.contains('cx'))c.hex=t.value;else if(t.classList.contains('cn'))c.name=t.value;else if(t.classList.contains('cs')){c.stk=c.stk||{};c.stk[t.dataset.s]=Math.max(0,Math.floor(Number(t.value))||0)}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('cf'))return;const r=t.closest('.cr'),c=tmpCols[+r.dataset.x];if(!c)return;[...t.files].forEach(fl=>{if(c.imgs.length>=8)return toast('Tối đa 8 ảnh cho mỗi màu');compress(fl,d=>{if(c.imgs.length<8){c.imgs.push(d);drawCols()}})});t.value=''});
$('#q').addEventListener('input',()=>{if($('#q').value&&tab!=='products')tab='products';render()});
$('#tg').addEventListener('click',()=>{dark=!dark;render()});
render();bnStart();setInterval(()=>{if(adm())loadOrders()},15000);
if(FB){try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth();
db.collection('replies').get().then(s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));render()}).catch(()=>{});
db.collection('shop').doc('data').get().then(d=>{if(d.exists){S=Object.assign(JSON.parse(JSON.stringify(DEF)),d.data());S.contact=Object.assign({},DEF.contact,S.contact);S.theme=Object.assign({},DEF.theme,S.theme)}}).then(()=>db.collection('products').where('imgOf','==','__banner').get().then(q=>{const a=[];q.docs.forEach(x=>{const o=x.data();a[o.i]=o.d});const g=a.filter(Boolean);if(g.length){S.theme.banners=g;S.theme.banner=''}}).catch(()=>{})).then(()=>loadProducts()).then(()=>{render();try{db.collection('products').orderBy('ord').onSnapshot(syncStock,()=>{})}catch(e){}}).catch(()=>render());
auth.onAuthStateChanged(u=>{if(!u){isAd=false;me='';guest=false;OR=[];orLoaded=false;render();return}me=u.email;db.collection('admins').doc(u.email).get().then(d=>{isAd=d.exists;if(!isAd){toast('Tài khoản này không có quyền quản trị');auth.signOut();return}guest=false;render();loadAdmins();loadOrders()}).catch(()=>{isAd=false;render()})})}catch(e){}}
</script>
